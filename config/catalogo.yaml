# Catálogo de series del monitor de insumos metalúrgicos.
# Es la única fuente de verdad: de acá salen la descarga, las validaciones y los textos del tablero.
#
# Campos de cada serie
#   id               identificador interno (no cambia nunca)
#   nombre           cómo se muestra en el tablero
#   mercado          país o región de referencia
#   tipo             precio_real | futuro | precio_comercio_exterior | indice | estimacion
#   que_mide         explicación simple, para el desplegable "Qué estamos midiendo"
#   limitaciones     qué no dice el dato o cómo puede engañar
#   fuente           nombre, url (para el lector) y acceso (cómo lo baja el pipeline)
#   frecuencia       diaria | semanal | decadal (cada 10 días) | mensual | trimestral
#   rezago           cuánto tarda en publicarse, aproximado
#   desde            primer dato disponible (verificado en las pruebas cuando dice "verificado")
#   unidad_original  como viene de la fuente
#   unidad_tablero   como se muestra (USD/t siempre que se pueda; los índices quedan como índice)
#   conversion       cómo se pasa de una a otra
#   licencia         uso_interno | publicable_citando | publicable_con_aviso | a_confirmar
#   estado           automatico | acumula (la fuente solo da el dato del día) | semiautomatico | pendiente
#
# Convenciones
#   - Toneladas métricas. Tonelada corta (EE.UU.) = 0,907185 t. Libra = 0,000453592 t.
#   - Los precios chinos vienen con IVA (13%): se muestran sin IVA para comparar con el resto.
#   - El pase a pesos usa el tipo de cambio mayorista A3500 del BCRA del mismo día (o promedio del mes en series mensuales).

tipos:
  precio_real: "Precio de mercado efectivamente relevado (spot o de contado)."
  futuro: "Precio de un contrato en bolsa para entrega futura. Se mueve casi igual que el precio de contado y se publica todos los días."
  precio_comercio_exterior: "Valor de lo exportado o importado dividido por las toneladas, según la aduana. Es un precio promedio real, con uno o dos meses de demora y sensible a cambios en la mezcla de productos."
  indice: "Índice oficial de precios (base 100). Muestra cuánto subió o bajó el precio, sin dar el valor en dinero."
  estimacion: "Cálculo propio a partir de otras series. Se indica el método."

auxiliares:
  - id: tc_a3500
    nombre: "Dólar mayorista A3500"
    fuente: {nombre: BCRA, url: "https://www.bcra.gob.ar", acceso: "API de estadísticas v4, variable 5"}
    frecuencia: diaria
    unidad_original: ARS/USD
    estado: automatico
  - id: tc_cny_usd
    nombre: "Yuan por dólar"
    fuente: {nombre: Yahoo Finance, url: "https://finance.yahoo.com/quote/CNY=X/", acceso: "Yahoo chart API, CNY=X"}
    frecuencia: diaria
    unidad_original: CNY/USD
    estado: pendiente
    nota: "Falta probar el ticker. Alternativa: tipo de pase CNY del BCRA, que ya usa el tablero macro."
  - id: tc_eur_usd
    nombre: "Dólar por euro"
    fuente: {nombre: Westmetall (fijación BCE), url: "https://www.westmetall.com/en/markdaten.php", acceso: "tabla Euro_EZB"}
    frecuencia: diaria
    unidad_original: USD/EUR
    estado: pendiente
    nota: "Falta probar el campo. Alternativa: Eurostat ert_bil_eur_d."

insumos:

