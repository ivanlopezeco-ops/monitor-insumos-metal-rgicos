  - id: acero_hrc
    grupo: Acero
    nombre: "Bobina laminada en caliente"
    que_es: "Chapa de acero laminada en caliente y enrollada. Es el producto plano más básico y la referencia de precio de todo el acero plano."
    por_que_importa: "Es insumo directo de piezas estampadas, perfiles conformados, tubos con costura y estructuras, y la base sobre la que se fija el precio del laminado en frío y del galvanizado."
    series:
      - id: hrc_eeuu_futuro
        nombre: "Bobina en caliente, Medio Oeste de EE.UU. (futuro)"
        mercado: EE.UU.
        tipo: futuro
        que_mide: "Precio del contrato más cercano de la bolsa CME para bobina laminada en caliente entregada en el Medio Oeste de EE.UU."
        limitaciones: "El mercado estadounidense está protegido con aranceles altos, así que suele estar por encima del resto del mundo."
        fuente: {nombre: "CME Group vía Yahoo Finance", url: "https://www.cmegroup.com/markets/metals/ferrous/hrc-steel.html", acceso: "Yahoo chart API, HRC=F"}
        frecuencia: diaria
        rezago: "1 día"
        desde: "2008-10 (verificado)"
        unidad_original: USD/tonelada corta
        unidad_tablero: USD/t
        conversion: "dividir por 0,907185"
        licencia: uso_interno
        estado: automatico
      - id: hrc_china_spot
        nombre: "Bobina en caliente, China (precio de mercado)"
        mercado: China
        tipo: precio_real
        que_mide: "Precio promedio de mercado de la bobina en caliente común (4,75 a 11,5 mm, Q235) relevado por la oficina de estadísticas china en 50 ciudades."
        limitaciones: "Es un promedio nacional con IVA incluido y se publica cada diez días."
        fuente: {nombre: "Oficina Nacional de Estadísticas de China (NBS)", url: "https://www.stats.gov.cn/sj/zxfb/", acceso: "HTML del informe de precios de medios de producción"}
        frecuencia: decadal
        rezago: "4 a 8 días"
        desde: "2022 o antes (verificado hasta 2022-04)"
        unidad_original: CNY/t con IVA
        unidad_tablero: USD/t
        conversion: "dividir por 1,13 (IVA) y por el tipo de cambio CNY/USD"
        licencia: a_confirmar
        estado: automatico
      - id: hrc_china_futuro
        nombre: "Bobina en caliente, Shanghái (futuro)"
        mercado: China
        tipo: futuro
        que_mide: "Precio de liquidación del contrato más negociado de bobina en caliente en la bolsa de futuros de Shanghái."
        limitaciones: "Incluye IVA. El contrato más negociado cambia cada pocos meses, lo que genera pequeños saltos."
        fuente: {nombre: "Shanghai Futures Exchange", url: "https://www.shfe.com.cn", acceso: "archivo diario kxAAAAMMDD.dat, producto hc"}
        frecuencia: diaria
        rezago: "mismo día"
        desde: "2014 (contrato lanzado ese año; archivos desde 2010 verificados)"
        unidad_original: CNY/t con IVA
        unidad_tablero: USD/t
        conversion: "dividir por 1,13 y por CNY/USD"
        licencia: uso_interno
        estado: automatico
      - id: hrc_europa_futuro
        nombre: "Bobina en caliente, norte de Europa (futuro)"
        mercado: Europa
        tipo: futuro
        que_mide: "Precio del contrato más cercano de la bolsa CME para bobina en caliente en el norte de Europa (índice Argus)."
        limitaciones: "Yahoo solo publica el dato del día, sin historia. La serie empieza cuando arranque el tablero."
        fuente: {nombre: "CME Group vía Yahoo Finance", url: "https://www.cmegroup.com/markets/metals/ferrous.html", acceso: "Yahoo chart API, EHR=F"}
        frecuencia: diaria
        rezago: "1 día"
        desde: "2026-10 (se acumula)"
        unidad_original: EUR/t
        unidad_tablero: USD/t
        conversion: "multiplicar por USD/EUR"
        licencia: uso_interno
        estado: acumula
      - id: hrc_ue_import_china
        nombre: "Bobina en caliente importada por la UE desde China"
        mercado: Europa
        tipo: precio_comercio_exterior
        que_mide: "Valor promedio por tonelada de los laminados planos en caliente (posición 7208) que la Unión Europea importa de China."
        limitaciones: "Promedio de todas las medidas y calidades de la posición. Llega con unos dos meses de demora."
        fuente: {nombre: "Eurostat Comext", url: "https://ec.europa.eu/eurostat/comext/newxtweb/", acceso: "API Comext DS-045409, producto 7208, socio CN, flujo importación"}
        frecuencia: mensual
        rezago: "unos 2 meses"
        desde: "a medir"
        unidad_original: EUR y 100 kg
        unidad_tablero: USD/t
        conversion: "valor / (cantidad en 100 kg / 10), por USD/EUR promedio del mes"
        licencia: publicable_citando
        estado: automatico
      - id: hrc_brasil_export
        nombre: "Bobina en caliente exportada por Brasil"
        mercado: Brasil
        tipo: precio_comercio_exterior
        que_mide: "Valor FOB promedio por tonelada de los laminados planos en caliente (posición 7208) que exporta Brasil."
        limitaciones: "Los volúmenes mensuales son chicos y varían mucho, así que el promedio puede saltar."
        fuente: {nombre: "Comex Stat (Ministerio de Desarrollo de Brasil)", url: "https://comexstat.mdic.gov.br", acceso: "API /general, flujo export, SH4 7208"}
        frecuencia: mensual
        rezago: "unos 10 días"
        desde: "1997 (verificado en mineral)"
        unidad_original: USD FOB y kg
        unidad_tablero: USD/t
        conversion: "FOB / kg x 1000"
        licencia: publicable_citando
        estado: automatico
      - id: hrc_japon_indice
        nombre: "Bobina en caliente, Japón (índice de productor)"
        mercado: Japón
        tipo: indice
        que_mide: "Índice de precios al productor de las bandas de acero laminadas en caliente en el mercado japonés."
        limitaciones: "Es un índice en yenes: muestra la variación, sin dar el nivel en dólares."
        fuente: {nombre: "Banco de Japón", url: "https://www.stat-search.boj.or.jp", acceso: "API BOJ, PRCG20_2200950006"}
        frecuencia: mensual
        rezago: "unos 10 días"
        desde: "1980 (verificado)"
        unidad_original: "índice 2020=100"
        unidad_tablero: "índice 2020=100"
        licencia: publicable_con_aviso
        estado: automatico
      - id: hrc_japon_import
        nombre: "Bobina en caliente importada por Japón (índice)"
        mercado: Japón
        tipo: indice
        que_mide: "Índice de precios de importación de bandas laminadas en caliente, en la moneda del contrato (mayormente dólares)."
        limitaciones: "Índice, sin nivel en dinero."
        fuente: {nombre: "Banco de Japón", url: "https://www.stat-search.boj.or.jp", acceso: "API BOJ, PRCG20_2500350004"}
