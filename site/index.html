<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de insumos metalúrgicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="marca">
        <h1>Monitor de insumos metalúrgicos</h1>
        <p class="sub" id="actualizado">Cargando datos…</p>
      </div>
      <div class="acciones">
        <span class="etq-general">Todos los gráficos</span>
        <div class="rangos" id="rangos" role="group" aria-label="Período de todos los gráficos">
          <button data-r="90">3M</button><button data-r="180">6M</button><button data-r="365">1A</button>
          <button data-r="1095" class="on">3A</button><button data-r="1826">5A</button><button data-r="3652">10A</button><button data-r="0">Todo</button>
        </div>
        <button class="tema" id="tema" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </header>

  <main id="main"></main>

  <footer class="pie">
    <p class="nota">Departamento de Estudios Económicos · ADIMRA. Versión de prueba para uso interno: varias fuentes no permiten redistribuir sus datos (se marcan como "uso interno").</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
