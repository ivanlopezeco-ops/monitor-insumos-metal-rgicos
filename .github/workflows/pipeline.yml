name: Actualización del monitor

# Corre cada 3 horas: toma los cierres de las bolsas (Asia, Europa y EE.UU.) y, mientras falte historia,
# avanza con el relleno progresivo de Shanghái, Zhengzhou y la oficina de estadísticas china.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "config/**"
      - "site/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # La base vive en la rama "datos", con un solo commit que se reemplaza en cada corrida.
      - name: Traer la base acumulada
        run: |
          if git fetch --depth 1 origin datos; then
            rm -rf data && git checkout FETCH_HEAD -- data && git reset -q data
          fi
          mkdir -p data && ls -la data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/pipeline.yml
      - run: pip install requests pandas openpyxl xlrd lxml html5lib beautifulsoup4 pyyaml
      - run: python pipeline/run.py
      - name: Guardar la base en la rama datos
        if: always()
        run: |
          [ -f data/series.csv ] || exit 0
          rm -rf /tmp/datos && mkdir -p /tmp/datos && cp -r data /tmp/datos/
          cd /tmp/datos
          git init -q -b datos
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Datos $(date -u +%Y-%m-%dT%H:%M)Z"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
